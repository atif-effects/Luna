<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Luna</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Background Video -->
<video autoplay loop muted playsinline class="bg-video">
  <source src="bg.mp4" type="video/mp4">
</video>

<!-- Top Header Bar (Sirf Profile Icon) -->
<header class="top-bar">
  <div class="header-right">
    <div class="user-profile">
      <img src="profile.png" alt="User Profile" onerror="this.src='https://ui-avatars.com/api/?name=User&background=4f46e5&color=fff'">
    </div>
  </div>
</header>

<!-- Dark Gradient Overlay -->
<div class="bg-overlay"></div>

  <!-- Icon sprite -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#4f8cff"/>
        <stop offset=".55" stop-color="#a78bfa"/>
        <stop offset="1" stop-color="#f4857a"/>
      </linearGradient>
    </defs>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.4 2.6a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4Z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
  </svg>

  <div class="app" id="app">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar" aria-label="Sidebar">
      <div class="side-head">
        <button class="logo-btn" id="logoBtn" type="button" aria-label="Nebula">
          <svg class="logo" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="url(#spark)" d="M12 2c.6 5.6 4.4 9.4 10 10-5.6.6-9.4 4.4-10 10-.6-5.6-4.4-9.4-10-10 5.6-.6 9.4-4.4 10-10Z"/></svg>
          <span class="label">Luna</span>
        </button>
        <button class="icon-btn collapse-btn" id="collapseBtn" type="button" aria-label="Collapse sidebar">
          <svg class="icon"><use href="#i-panel"/></svg>
        </button>
      </div>

      <nav class="side-nav">
        <button class="nav-item active" id="newChat" type="button" title="New chat">
          <svg class="icon"><use href="#i-edit"/></svg>
          <span class="label">New chat</span>
        </button>
        <button class="nav-item" id="searchBtn" type="button" title="Search chats">
          <svg class="icon"><use href="#i-search"/></svg>
          <span class="label">Search chats</span>
        </button>
      </nav>

      <div class="search-box" id="searchBox" hidden>
        <input type="search" id="searchInput" placeholder="Search chats" autocomplete="off" aria-label="Search chats">
      </div>

      <div class="recent">
        <h2 class="recent-title">Recent</h2>
        <ul class="chat-list" id="chatList"></ul>
        <p class="no-results" id="noResults" hidden>No chats match your search.</p>
      </div>
    </aside>

    <div class="backdrop" id="backdrop"></div>

<!-- Main -->
    <main class="main" id="main">
      <header class="topbar">
        <button class="icon-btn" id="menuBtn" type="button" aria-label="Open sidebar">
          <svg class="icon"><use href="#i-menu"/></svg>
        </button>
        <span class="brand"></span>
      </header>

      <div class="stage">
        
        <!-- Naya Mobile Center Logo -->
        <div class="mobile-center-logo">
          <!-- Gemini Sparkle/Star Icon (Image ke mutabiq) -->
          <svg class="logo" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="url(#spark)" d="M12 2c.6 5.6 4.4 9.4 10 10-5.6.6-9.4 4.4-10 10-.6-5.6-4.4-9.4-10-10 5.6-.6 9.4-4.4 10-10Z"/></svg>
        </div>

        <h1 class="greeting">What should we focus on?</h1>
        <div class="messages" id="messages" aria-live="polite"></div>

        <form class="composer" id="composer">
          <div class="input-box" id="inputBox">
            
            <!-- 1. Plus Button Wrapper -->
            <div class="plus-wrapper" id="plusWrapper">
              <button class="icon-btn" id="plusBtn" type="button" aria-label="Add attachment">
                <svg class="icon"><use href="#i-plus"/></svg>
              </button>

              <!-- Glassmorphic Plus Menu -->
              <div class="plus-menu" id="plusMenu">
                <button type="button" class="menu-item">
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                  <span>Files</span>
                </button>
                <button type="button" class="menu-item">
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>
                  <span>Drive</span>
                </button>
                <button type="button" class="menu-item">
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
                  <span>More uploads</span>
                </button>
              </div>
            </div>

            <!-- 2. Mic Button (Dynamic Order) -->
            <button class="icon-btn mic" id="micBtn" type="button" aria-label="Voice input">
              <svg class="icon"><use href="#i-mic"/></svg>
            </button>

            <!-- 3. Textarea Input -->
            <textarea id="prompt" rows="1" placeholder="Ask Luna" aria-label="Message"></textarea>
            
            <!-- 4. Luna Model Selector Dropdown -->
            <div class="model-selector-wrapper">
              <!-- Borderless Button Style -->
              <button type="button" class="model-select-btn" id="modelSelectBtn">
                <span id="selectedModelLabel">5.1 Luna Flash</span>
                <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
              </button>

              <!-- Glassmorphic Model Menu with Tick Marks -->
              <div class="model-menu" id="modelMenu">
                <!-- Lite -->
                <button type="button" class="model-option" data-model="3.1 Luna Lite">
                  <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                  <div class="model-text">
                    <div class="model-title">3.1 Luna Lite</div>
                    <div class="model-desc">Fastest answers</div>
                  </div>
                </button>
                
                <!-- Flash (Default Selected) -->
                <button type="button" class="model-option active" data-model="5.1 Luna Flash">
                  <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                  <div class="model-text">
                    <div class="model-title">5.1 Luna Flash</div>
                    <div class="model-desc">All-around help</div>
                  </div>
                </button>
                
                <!-- Pro -->
                <button type="button" class="model-option" data-model="7.0 Luna Pro">
                  <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                  <div class="model-text">
                    <div class="model-title">7.0 Luna Pro</div>
                    <div class="model-desc">Advance reasoning</div>
                  </div>
                </button>
              </div>
            </div>

            <!-- 5. Send Button -->
            <button class="send-btn" id="sendBtn" type="submit" aria-label="Send message">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>

          </div>
        </form>
      </div>
    </main>

  </div>

  <script src="script.js"></script>
</body>
</html>
